name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Offline checks (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustup component add clippy

      - name: Install JavaScript dependencies
        run: npm ci --prefix apps/desktop

      - name: Fetch verified media engines
        run: node scripts/prepare-binaries.mjs x86_64-pc-windows-msvc

      - name: Security, lint and unit tests
        run: npm run check:beta
