name: Windows release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Least privilege: building (which runs third-party install scripts) only gets
# read access. Only the small publish job can write releases.
permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustup component add clippy

      - name: Install JavaScript dependencies
        run: npm ci --prefix apps/desktop

      - name: Fetch verified media engines
        run: node scripts/prepare-binaries.mjs x86_64-pc-windows-msvc

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }

      - name: Run deterministic beta checks
        run: npm run check:beta

      - name: Build application and native host
        run: npm run build

      - name: Verify no build-machine paths in release binaries
        shell: pwsh
        run: |
          foreach ($exe in Get-ChildItem apps/desktop/src-tauri/target/release/lipit-*.exe) {
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe.FullName))
            if ($text.Contains("src-tauri\binaries") -or $text.Contains("src-tauri/binaries")) {
              throw "$($exe.Name) contains a build-machine engine path"
            }
          }

      - name: Verify native messaging host binary
        run: npm run test:native

      - name: Package unsigned NSIS setup
        run: npm run package:windows

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
          if (-not $start) { $start = ($lines | Select-String -Pattern "^## \[Yayımlanmamış\]" | Select-Object -First 1).LineNumber }
          $notes = @()
          if ($start) {
            foreach ($line in $lines[$start..($lines.Count - 1)]) {
              if ($line -match "^## ") { break }
              $notes += $line
            }
          }
          $notes += ""
          $notes += "## Kurulum"
          $notes += ""
          $notes += "Bu beta setup henüz kod imzalı değildir. Windows SmartScreen uyarı gösterebilir. SHA256SUMS.txt ile dosya özetini doğrulayabilirsiniz."
          $notes += ""
          $notes += "Kod imzalama ilkesi: https://github.com/$env:GITHUB_REPOSITORY/blob/main/docs/code-signing-policy.md"
          $notes | Set-Content release/release-notes.md -Encoding utf8

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lipit-windows-x64-unsigned-${{ github.sha }}
          path: |
            release/Lipit-Capture-*-Windows-x64-unsigned-setup.exe
            release/SHA256SUMS.txt
            release/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub prerelease
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: lipit-windows-x64-unsigned-${{ github.sha }}
          path: release

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          setup=$(ls release/Lipit-Capture-*-Windows-x64-unsigned-setup.exe | head -n 1)
          gh release create "$GITHUB_REF_NAME" "$setup" release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lipit Capture $GITHUB_REF_NAME" \
            --notes-file release/release-notes.md \
            --prerelease \
            --verify-tag
