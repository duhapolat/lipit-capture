name: Windows release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustup component add clippy

      - name: Install JavaScript dependencies
        run: npm ci --prefix apps/desktop

      - name: Fetch verified media engines
        run: node scripts/prepare-binaries.mjs x86_64-pc-windows-msvc

      - name: Run deterministic beta checks
        run: npm run check:beta

      - name: Build application and native host
        run: npm run build

      - name: Package unsigned NSIS setup
        run: npm run package:windows

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lipit-windows-x64-unsigned-${{ github.sha }}
          path: |
            release/Lipit-Capture-*-Windows-x64-unsigned-setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
