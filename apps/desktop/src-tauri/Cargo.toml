[package]
name = "lipit-desktop"
version = "1.0.0-beta.3"
description = "Local media capture and download desktop app"
authors = ["Muhammed Duha Polat"]
license = "GPL-3.0-or-later"
edition = "2021"
default-run = "lipit-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Lipit currently ships as a Windows desktop app. Keeping only the Rust
# library artifact avoids the Windows DLL export limit during test builds.
name = "lipit_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
