<!doctype html>
<html lang="tr" style="background:#0d1113">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Lipit hızlı işlem</title>
    <style>
      html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:#0d1113;color:#eee9e5}
      *{box-sizing:border-box}
      .widget-fallback{width:calc(100% - 12px);height:calc(100% - 12px);margin:6px;padding:14px;border:1px solid #80503d;border-radius:5px;background:linear-gradient(180deg,#1d2225,#111517);font:12px/1.4 "Segoe UI",sans-serif;box-shadow:inset 3px 0 #e37847}
      .widget-fallback strong{display:block;margin-bottom:8px;color:#ff9c70;font:600 14px Georgia,serif}
      .widget-fallback span{color:#938b85}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="widget-fallback">
        <strong>Lipit hızlı işlem</strong>
        <span>İşlem hazırlanıyor…</span>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
